openapi: 3.0.3

info:
  title: Library Management API
  description: RESTful API for managing books in a library application.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development server

paths:

  /api/books:
    get:
      summary: Retrieve all books
      responses:
        '200':
          description: Books retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
              example:
                - id: 1
                  title: The Great Gatsby
                  author: F. Scott Fitzgerald
                  isbn: "9780743273565"
                - id: 2
                  title: "1984"
                  author: George Orwell
                  isbn: "9780451524935"

    post:
      summary: Add a new book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
            example:
              title: Animal Farm
              author: George Orwell
              isbn: "9780451526342"

      responses:
        '201':
          description: Book successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'

        '400':
          description: Missing or invalid book information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Title, author and ISBN are required.

        '409':
          description: A book with the ISBN already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A book with this ISBN already exists.

  /api/books/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the book
        schema:
          type: integer
        example: 1

    get:
      summary: Retrieve a book by ID
      responses:
        '200':
          description: Book retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'

        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Book not found

    put:
      summary: Update an existing book
      description: Replaces the existing book information with the supplied values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
            example:
              title: Nineteen Eighty-Four
              author: George Orwell
              isbn: "9780451524935"

      responses:
        '200':
          description: Book successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'

        '400':
          description: Missing or invalid book information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Book not found

        '409':
          description: Another book already uses the supplied ISBN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A book with this ISBN already exists.

    delete:
      summary: Delete a book
      responses:
        '204':
          description: Book successfully deleted

        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Book not found

components:
  schemas:

    Book:
      type: object
      required:
        - id
        - title
        - author
        - isbn
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: The Great Gatsby
        author:
          type: string
          example: F. Scott Fitzgerald
        isbn:
          type: string
          example: "9780743273565"

    BookInput:
      type: object
      required:
        - title
        - author
        - isbn
      properties:
        title:
          type: string
          example: The Great Gatsby
        author:
          type: string
          example: F. Scott Fitzgerald
        isbn:
          type: string
          example: "9780743273565"

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Book not found