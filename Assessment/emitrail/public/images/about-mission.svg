<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Individual travel choices connecting to community climate action">
  <defs>
    <clipPath id="aboutFrame"><rect width="640" height="440" rx="24" /></clipPath>
  </defs>
  <g clip-path="url(#aboutFrame)">
    <rect width="640" height="440" fill="#eef6ef" />

    <!-- concentric community rings -->
    <circle cx="320" cy="220" r="170" fill="none" stroke="#cdeccf" stroke-width="18" />
    <circle cx="320" cy="220" r="120" fill="none" stroke="#a9dcac" stroke-width="16" />
    <circle cx="320" cy="220" r="66" fill="#b8e8ba" />
    <circle cx="320" cy="220" r="66" fill="none" stroke="#6fbf73" stroke-width="4" />

    <!-- leaf at the centre -->
    <path d="M300 236c4-20 16-34 40-40-2 22-12 38-24 46-6 4-14 2-16-6z" fill="#2f7a3a" />
    <path d="M300 236c8-10 18-18 34-22" fill="none" stroke="#b8e8ba" stroke-width="3" stroke-linecap="round" />

    <!-- route linking individual nodes to the community -->
    <g fill="none" stroke="#2f7a3a" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round">
      <path d="M96 96C180 150 180 150 254 186" />
      <path d="M548 108C470 150 470 150 388 190" />
      <path d="M110 372C200 320 200 320 268 268" />
      <path d="M540 356C450 312 450 312 384 262" />
    </g>

    <!-- individual travellers -->
    <g fill="#222">
      <circle cx="88" cy="86" r="14" /><path d="M70 124c0-12 8-20 18-20s18 8 18 20z" />
      <circle cx="556" cy="98" r="14" /><path d="M538 136c0-12 8-20 18-20s18 8 18 20z" />
      <circle cx="102" cy="384" r="14" /><path d="M84 422c0-12 8-20 18-20s18 8 18 20z" />
      <circle cx="548" cy="366" r="14" /><path d="M530 404c0-12 8-20 18-20s18 8 18 20z" />
    </g>
  </g>
</svg>
