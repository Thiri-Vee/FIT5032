<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-label="Emitrail active travel">
  <defs>
    <clipPath id="authFrame"><rect width="480" height="560" rx="20" /></clipPath>
  </defs>
  <g clip-path="url(#authFrame)">
    <rect width="480" height="560" fill="#2f7a3a" />
    <circle cx="400" cy="90" r="120" fill="#3c8a47" />

    <!-- hills -->
    <path d="M0 430c110-50 180-20 260 10s150 10 220-30v150H0z" fill="#3c8a47" />
    <path d="M0 470c120-40 190 0 280 20s130 0 200-30v100H0z" fill="#4a9a56" />

    <!-- route -->
    <path d="M60 540C110 430 60 360 150 320s110-120 200-150" fill="none" stroke="#b8e8ba" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 18" />
    <circle cx="60" cy="540" r="10" fill="#b8e8ba" />
    <circle cx="350" cy="170" r="10" fill="#b8e8ba" />

    <!-- cyclist -->
    <g transform="translate(150 300)" stroke="#b8e8ba" stroke-width="6" fill="none" stroke-linecap="round">
      <circle cx="0" cy="40" r="22" />
      <circle cx="60" cy="40" r="22" />
      <path d="M0 40 28 10h20" />
      <path d="M28 10 48 40H0" stroke-width="5" />
      <circle cx="36" cy="-10" r="8" fill="#2f7a3a" />
      <path d="M36 -3 28 10M36 0l14 8" />
    </g>

    <!-- leaves -->
    <path d="M360 300c14-6 24-4 34-16 4 12 2 22-8 30s-24 4-26-14z" fill="#b8e8ba" opacity="0.85" />
  </g>
</svg>
