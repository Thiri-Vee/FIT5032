<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="A winding active-travel route through green hills">
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="640" height="440" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="640" height="440" fill="#eef6ef"/>
    <circle cx="512" cy="96" r="44" fill="#b8e8ba"/>
    <circle cx="512" cy="96" r="26" fill="#6fbf73"/>

    <!-- distant hills -->
    <path d="M0 300c120-70 200-70 320-10s220 40 320-20v190H0z" fill="#cdeccf"/>
    <path d="M0 350c140-60 230-30 340 10s200 20 300-30v140H0z" fill="#a9dcac"/>
    <path d="M0 400c150-40 250 10 360 20s180-10 280-40v100H0z" fill="#8ccf92"/>

    <!-- winding path -->
    <path d="M70 470C120 360 60 300 180 260s120-90 240-70 120 120 180 70" fill="none" stroke="#f4f7f4" stroke-width="46" stroke-linecap="round"/>
    <path d="M70 470C120 360 60 300 180 260s120-90 240-70 120 120 180 70" fill="none" stroke="#2f7a3a" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 22"/>

    <!-- trees -->
    <g fill="#2f7a3a">
      <circle cx="120" cy="250" r="20"/><rect x="117" y="255" width="6" height="26"/>
      <circle cx="500" cy="300" r="24"/><rect x="497" y="306" width="6" height="30"/>
      <circle cx="560" cy="330" r="16"/><rect x="557" y="334" width="6" height="22"/>
    </g>

    <!-- cyclist -->
    <g transform="translate(276 250)" stroke="#222" stroke-width="6" fill="none" stroke-linecap="round">
      <circle cx="0" cy="46" r="26"/>
      <circle cx="72" cy="46" r="26"/>
      <path d="M0 46 34 12h22"/>
      <path d="M34 12 56 46H0" stroke-width="5"/>
      <circle cx="42" cy="-14" r="9" fill="#b8e8ba"/>
      <path d="M42 -6 34 12M42 -2l16 8M34 12l-8 12" />
    </g>

    <!-- floating leaves -->
    <g fill="#6fbf73">
      <path d="M96 110c14-10 26-8 34-20 4 12 2 22-6 30s-20 8-28 0z"/>
      <path d="M430 70c10-8 20-6 26-16 3 10 1 18-5 24s-16 6-21 0z" opacity="0.8"/>
    </g>
  </g>
</svg>
